# Always-on Whole-book worker. From the repo root:
#   cp env.worker.example .env.worker
#   docker compose up -d --build
#
# Document extract does not run here — deploy workers/extract to Cloudflare.

services:
  takehome:
    build:
      context: .
      dockerfile: workers/takehome/Dockerfile
    image: echomancer-takehome:local
    container_name: echomancer-takehome
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      # Loopback only. Put Caddy/nginx TLS on 443 and set WORKER_URL to https://…
      - "127.0.0.1:${WORKER_PUBLISH_PORT:-8788}:8788"
    env_file:
      - .env.worker
    environment:
      WORKER: "1"
      WORKER_HOST: "0.0.0.0"
      WORKER_PORT: "8788"
      NODE_ENV: production
      DEEP_FILTER_BIN: /usr/local/bin/deep-filter
      TTS_MASTER_FULL_BOOK: "1"
      TTS_POLL_NUDGE_BUDGET_MS: "0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
