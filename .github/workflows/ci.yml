name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The suite probes voice samples and masters synthetic audio. Both need
      # ffmpeg, and the LUFS check imports numpy.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-numpy
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
